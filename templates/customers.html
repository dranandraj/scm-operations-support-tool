{% extends "base.html" %}

{% block title %}Customers{% endblock %}

{% block content %}

<h2 class="mb-4">Customers</h2>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>Customer ID</th>
            <th>Customer Name</th>
            <th>Country</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ customer[0] }}</td>
            <td>{{ customer[1] }}</td>
            <td>{{ customer[2] }}</td>
            <td>{{ customer[3] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
