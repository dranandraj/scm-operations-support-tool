{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

    <h1 class="mb-4">
        SCM Operations Support Tool
    </h1>

    <div class="row">

        <div class="col-md-3">
            <a href="/customers" class="text-decoration-none text-dark">
                <div class="card text-center">
                    <div class="card-body">
                        <h3> {{ customers_count }}</h3>
                        <p>Customers</p>
                    </div>
                </div>
            </a>
        </div>
        
    
        <div class="col-md-3">
            <a href="/materials" class="text-decoration-none text-dark">
                <div class="card text-center">
                    <div class="card-body">
                        <h3> {{ materials_count }}</h3>
                        <p>Materials</p>
                    </div>
                </div>
            </a>
        </div>
    
    

        <div class="col-md-3">
            <a href="/sales_orders" class="text-decoration-none text-dark">
                <div class="card text-center">
                    <div class="card-body">
                        <h3> {{ sales_orders_count }}</h3>
                        <p>Sales Orders</p>
                    </div>
                </div>
            </a>
        </div>
    

        <div class="col-md-3">
            <a href="/support_requests" class="text-decoration-none text-dark">
                <div class="card text-center">
                    <div class="card-body">
                        <h3> {{ support_requests_count }}</h3>
                        <p>Support Requests</p>
                    </div>
                </div>
            </a>
        </div>
    
    </div>
{% endblock %}
