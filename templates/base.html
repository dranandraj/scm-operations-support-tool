<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Business Operations Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .sortable-header {
            color: white;
            text-decoration: none;
            display: block;
        }

        .sortable-header:hover {
            color: #ddd;
        }

        .sort-icon {
            margin-left: 6px;
            font-size: 0.85em;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                Business Operations Management System
            </a>

            {% if session.get("logged_in") %}
            <div>
                <a class="btn btn-outline-light btn-sm" href="/">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" href="/customers">Customers</a>
                <a class="btn btn-outline-light btn-sm" href="/materials">Materials</a>
                <a class="btn btn-outline-light btn-sm" href="/sales_orders">Sales Orders</a>
                <a class="btn btn-outline-light btn-sm" href="/support_requests">Support Requests</a>
                <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
            </div>
            {% endif %}

        </div>
    </nav>

    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

    <script>
        function changePageSize(value) {

            const url = new URL(window.location.href);

            // Change rows per page
            url.searchParams.set("per_page", value);

            // When page size changes, go back to page 1
            url.searchParams.set("page", "1");

            // Reload page
            window.location.href = url.toString();
        }
    </script>

    <script>
        window.addEventListener("pageshow", function (event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

        window.addEventListener("popstate", function () {
            window.location.reload();
        });
    </script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
