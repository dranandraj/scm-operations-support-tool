<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SCM Operations Support Tool{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sortable-header {
            color: white;
            text-decoration: none;
            display: block;
        }

        .sortable-header:hover {
            color: #ddd;
        }

        .sort-icon {
            margin-left: 6px;
            font-size: 0.85em;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SCM Operations Support Tool</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="/customers">Customers</a>
            <a class="btn btn-outline-light btn-sm" href="/materials">Materials</a>
            <a class="btn btn-outline-light btn-sm" href="/sales_orders">Sales Orders</a>
            <a class="btn btn-outline-light btn-sm" href="/support_requests">Support Requests</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
