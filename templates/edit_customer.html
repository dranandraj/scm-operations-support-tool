{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">Edit Customer</h1>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <!-- Customer ID -->
        <div class="mb-3">
            <label class="form-label">Customer ID</label>

            <input type="text" class="form-control" value="{{ customer[0] }}" readonly>
        </div>

        <!-- Customer Name -->
        <div class="mb-3">
            <label class="form-label">Customer Name</label>

            <input type="text" name="customer_name" class="form-control" value="{{ customer[1] }}" required>
        </div>

        <!-- Country -->
        <div class="mb-3">
            <label class="form-label">Country</label>

            <select name="country" class="form-select" required>

                <option value="Japan" {% if customer[2]=="Japan" %}selected{% endif %}>
                    Japan
                </option>

                <option value="India" {% if customer[2]=="India" %}selected{% endif %}>
                    India
                </option>

                <option value="Singapore" {% if customer[2]=="Singapore" %}selected{% endif %}>
                    Singapore
                </option>

                <option value="Germany" {% if customer[2]=="Germany" %}selected{% endif %}>
                    Germany
                </option>

                <option value="USA" {% if customer[2]=="USA" %}selected{% endif %}>
                    USA
                </option>

            </select>
        </div>

        <!-- Status -->
        <div class="mb-3">
            <label class="form-label">Status</label>

            <select name="status" class="form-select" required>

                <option value="Active" {% if customer[3]=="Active" %}selected{% endif %}>
                    Active
                </option>

                <option value="Inactive" {% if customer[3]=="Inactive" %}selected{% endif %}>
                    Inactive
                </option>

            </select>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary">
            Update Customer
        </button>

        <a href="{{ url_for(
            'customers',
            search=search,
            country=country_filter,
            status=status_filter,
            sort_by=sort_by,
            sort_order=sort_order,
            per_page=per_page,
            page=page
        ) }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
