{% if total_pages > 1 %}

<nav class="mt-4">

    <ul class="pagination justify-content-center">

        <!-- Previous -->

        <li class="page-item {% if page == 1 %}disabled{% endif %}">

            {% if page > 1 %}

            <a
                class="page-link"
                href="{{ url_for(
                    request.endpoint,
                    search=search,
                    category=category,
                    plant=plant,
                    status=status,
                    sort_by=sort_by,
                    sort_order=sort_order,
                    per_page=per_page,
                    page=page-1
                ) }}"
            >
                Previous
            </a>

            {% else %}

            <span class="page-link">
                Previous
            </span>

            {% endif %}

        </li>


        <!-- Page Numbers -->

        {% for page_number in range(1, total_pages + 1) %}

        <li
            class="page-item
            {% if page_number == page %}active{% endif %}"
        >

            <a
                class="page-link"
                href="{{ url_for(
                    request.endpoint,
                    search=search,
                    category=category,
                    plant=plant,
                    status=status,
                    sort_by=sort_by,
                    sort_order=sort_order,
                    per_page=per_page,
                    page=page_number
                ) }}"
            >
                {{ page_number }}
            </a>

        </li>

        {% endfor %}


        <!-- Next -->

        <li
            class="page-item
            {% if page == total_pages %}disabled{% endif %}"
        >

            {% if page < total_pages %}

            <a
                class="page-link"
                href="{{ url_for(
                    request.endpoint,
                    search=search,
                    category=category,
                    plant=plant,
                    status=status,
                    sort_by=sort_by,
                    sort_order=sort_order,
                    per_page=per_page,
                    page=page+1
                ) }}"
            >
                Next
            </a>

            {% else %}

            <span class="page-link">
                Next
            </span>

            {% endif %}

        </li>

    </ul>

</nav>

{% endif %}
